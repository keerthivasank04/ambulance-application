services:
  - type: web
    name: tn-ambulance-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GPS_API_KEY
        value: arduino-bridge-secret
      - key: CORS_ORIGINS
        value: https://ambulance-application.vercel.app,https://tn-ambulance-frontend.vercel.app
